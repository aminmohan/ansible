- name: To update UBUNTU cache
  tags: always
  apt:
    update_cache: true
  when: ansible_distribution == "Ubuntu"
    #- name: To update CENTOS cache
    #tags: always
    #dnf:
    #update_cache: true
    #when: ansible_distribution == "CentOS"
- name: create user mohan
  tags: always
  user:
    name: mohan
    groups: root
  when: ansible_distribution == "CentOS","Ubuntu"
- name: Install key file for user mohan
  tags: always
  authorized_key:
    user: mohan
    key: "ssh-rsa  ansible@ubuntu-c"


- name: sudo permission to mohan on centos and ubuntu systems
  tags: always
  copy:
    src: sudoer_mohan
    dest: /etc/sudoers.d/mohan
    owner: root
    group: root
    mode: 0440
  when: ansible_distribution == "CentOS","Ubuntu"
